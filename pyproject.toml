[project]
name = "modelo-credito"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evaldo", email = "evaldoazeredoc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "feature-engine>=1.9.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "optbinning>=1.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "sweetviz>=2.3.3",
]

[project.scripts]
modelo-credito = "modelo_credito:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
